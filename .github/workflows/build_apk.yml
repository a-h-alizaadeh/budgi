name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      shell: bash
      run: gradle assembleDebug --no-daemon 2>&1 | tee build.log

    - name: Show errors (only when the build failed)
      if: failure()
      shell: bash
      run: |
        echo "=============== ERRORS (copy these lines) ==============="
        grep -E "^e: |error:|AAPT|What went wrong" -A3 build.log | head -120 || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wallet-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
